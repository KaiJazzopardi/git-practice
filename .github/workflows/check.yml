name: check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: README must not contain the word BROKEN
        run: |
          if grep -n "BROKEN" README.md; then
            echo "Remove the word BROKEN from README.md"
            exit 1
          fi
